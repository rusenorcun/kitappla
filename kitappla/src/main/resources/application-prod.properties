# Üretim profili: ters vekil (Caddy) arkasında çalışmak üzere.
# Çalıştırma:  java -jar kitappla.jar --spring.profiles.active=prod

# --- Ters vekil arkasında ---
# Caddy'nin ilettiği X-Forwarded-* başlıkları dikkate alınsın; yoksa giriş
# sonrası yönlendirmeler http:// olarak üretilir ve tarayıcı HTTPS'ten düşer.
server.forward-headers-strategy=framework

# Uygulama varsayılan olarak yalnızca yerel arayüzü dinler; dışarıya sadece
# Caddy açıktır. Docker'da bu 0.0.0.0 olmalıdır (yalıtımı Docker ağı sağlar,
# uygulamanın portu ana makineye hiç yayınlanmaz) — compose bunu ayarlar.
server.address=${KITAPPLA_BIND:127.0.0.1}
server.port=${SERVER_PORT:8080}

# Sunucu imzasını ve hata ayrıntılarını dışarı verme
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Oturum ve Çerez Güvenliği (Üretim / HTTPS) ---
server.servlet.session.cookie.name=KITAPPLA_SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=14d
kitappla.security.remember-me.secure=true
kitappla.security.remember-me.key=${KITAPPLA_REMEMBER_ME_KEY:kitappla-prod-secret-remember-me-key}

# --- Şablon önbelleği açık (dev'de kapalıydı) ---
spring.thymeleaf.cache=true

# --- H2 konsolu kapalı ---
# application.properties'te geliştirme için açık; burada ezilmezse prod'da da /h2 yolu
# herkese açık kayıtlı kalıyordu (erişimi yalnızca H2'nin uzak bağlantı ayarı engelliyordu).
spring.h2.console.enabled=false

# --- Veritabanı: PostgreSQL + Flyway ---
spring.datasource.url=jdbc:postgresql://${KITAPPLA_DB_HOST:postgres}:${KITAPPLA_DB_PORT:5432}/${KITAPPLA_DB_NAME:kitappla}
spring.datasource.username=${KITAPPLA_DB_USER:kitappla}
spring.datasource.password=${KITAPPLA_DB_PASSWORD:kitappla}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Bağlantı havuzu (HikariCP) ---
# Varsayılan 10 bağlantı yük testinde 200 eşzamanlı oturumda doydu. Sorgular kısa olduğu
# için 20 yeterli; boş bağlantı beklemesi 30 sn yerine 5 sn: kuyrukta bekleyen istek yerine
# hızlı ve görünür hata.
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

# --- Tomcat ---
# İş parçacıkları doluyken bekleyebilecek bağlantı sayısı ve boştaki bağlantının ömrü.
# Canlı akış (SSE) bağlantıları iş parçacığı tutmaz; max-connections varsayılanı (8192) yeterli.
server.tomcat.accept-count=200
server.tomcat.keep-alive-timeout=120s
server.tomcat.max-part-count=50

# --- Yüklenen dosyalar ---
kitappla.upload-dir=${KITAPPLA_UPLOAD_DIR:./uploads}

# --- Loglama ---
logging.level.root=INFO
logging.level.app.kitappla=INFO

# --- Örnek veri (üretimde varsayılan kapalı; .env içinden açılabilir) ---
kitappla.seed.demo=${KITAPPLA_SEED_DEMO:false}

# --- Özellik bayrakları ---
kitappla.features.document=${KITAPPLA_DOCUMENT:true}


