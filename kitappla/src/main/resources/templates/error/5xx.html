<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${marka.ad} + ' — Bir şeyler ters gitti')}"></head>
<body>
<div th:replace="~{fragments :: publicnav}"></div>
<div class="container" style="padding:90px 32px; text-align:center;">
  <div style="font-size:64px; font-weight:800; letter-spacing:-2px; color:var(--faint); line-height:1"
       th:text="${status} ?: '500'">500</div>
  <h1 style="font-size:28px; font-weight:800; letter-spacing:-.6px; margin:12px 0 8px">Bir şeyler ters gitti</h1>
  <p class="muted" style="font-weight:500; margin:0 0 8px" th:text="${message} ?: 'İşlemi tamamlayamadık. Lütfen tekrar deneyin.'">İşlemi tamamlayamadık. Lütfen tekrar deneyin.</p>
  <p th:if="${cause != null and !#strings.isEmpty(cause) and cause != message}" 
     style="font-size:13px; color:var(--text); background:rgba(0,0,0,0.05); padding:8px 14px; border-radius:6px; display:inline-block; margin:0 0 16px; max-width:600px" 
     th:text="${cause}"></p>
  <p class="muted" style="font-size:13px; margin:0 0 26px">Sürerse
    <a th:href="@{/iletisim}" style="font-weight:700">bize bildir</a>.</p>
  <div class="row gap-12" style="justify-content:center">
    <a class="btn btn-primary" th:href="@{/}">Ana sayfaya dön</a>
    <a class="btn btn-soft" th:href="@{/kesfet}">Bağışları keşfet</a>
  </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
